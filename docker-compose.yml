services:
  postgres:
    image: postgres:17
    container_name: monorepo-postgres
    environment:
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: mecross
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: monorepo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
