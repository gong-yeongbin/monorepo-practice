name: deploy backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

# 배포가 겹치면 ECS가 두 배포를 동시에 굴려 어느 이미지가 남는지 알 수 없다.
# cancel-in-progress는 쓰지 않는다 — push가 끝난 배포를 중간에 끊으면 서비스가 어정쩡한 상태로 남는다.
concurrency:
  group: deploy-backend

# id-token: OIDC 토큰 발급용. 이게 없으면 역할을 가져올 수 없다.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: mecross-backend
  ECS_CLUSTER: mecross-cluster
  ECS_SERVICE: mecross-backend
  ECS_TASK_FAMILY: mecross-backend
  LOG_GROUP: /ecs/mecross-backend

jobs:
  deploy:
    # Fargate 태스크가 ARM64(Graviton)라 이미지도 arm64여야 한다.
    # x86 러너에서 빌드하면 QEMU 에뮬레이션이라 몇 배 느려진다 — arm 러너에서 네이티브로 빌드한다.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # 장기 키 대신 OIDC로 역할을 가져온다. 역할의 신뢰 정책이 이 저장소의 main 브랜치만
      # 허용하므로(infra/terraform/envs/prod/cicd.tf) 포크의 워크플로는 통과하지 못한다.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::478657622805:role/mecross-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # latest는 태스크 정의가 가리키는 태그, 커밋 SHA는 추적·롤백용이다.
      - name: build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -f apps/backend/Dockerfile \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" \
            -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" .
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

      # 마이그레이션은 새 코드를 배포하기 전에 끝나야 한다 — 순서가 뒤집히면 새 태스크가
      # 옛 스키마를 보는 구간이 생긴다. 서비스 태스크와 같은 정의를 command override로 띄우므로
      # 방금 push한 이미지, 같은 SSM 시크릿, 같은 서브넷·보안그룹을 그대로 쓴다.
      # 네트워크 설정은 서비스에서 그대로 읽어온다 — 워크플로에 서브넷 id를 박아두지 않기 위해서다.
      # Spot 중단이 DDL 도중에 나면 곤란하므로 launch-type은 FARGATE(온디맨드)로 고정한다.
      - name: migrate
        run: |
          NETWORK=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' --output json)

          # CLI는 이미지에 없다(런타임 이미지를 230MB 불리지 않기 위해 — apps/backend/Dockerfile 참고).
          # 실행 시점에 받아 /app/node_modules로 옮긴다. npx로는 안 된다 — prisma.config.ts가
          # 'prisma/config'를 import하는데 npx 캐시에 있는 CLI는 /app에서 해석되지 않는다.
          # 버전은 package.json이 선언한 범위를 그대로 써서 두 곳이 어긋나지 않게 한다.
          # 실행은 package.json의 deploy 스크립트에 맡긴다 — 명령이 바뀌어도 여기가 따라간다.
          # npm run이어야 한다. pnpm deploy는 워크스페이스를 복사하는 pnpm 내장 명령이라
          # 스크립트가 아니라 엉뚱한 동작을 한다(Dockerfile이 실제로 그 내장 명령을 쓰고 있다).
          PRISMA_RANGE=$(node -p "require('./apps/backend/package.json').devDependencies.prisma")
          MIGRATE_CMD="npm install --no-save --no-package-lock --prefix /tmp/cli 'prisma@${PRISMA_RANGE}'"
          MIGRATE_CMD="$MIGRATE_CMD && cp -Rn /tmp/cli/node_modules/. node_modules/"
          MIGRATE_CMD="$MIGRATE_CMD && npm run deploy"

          OVERRIDES=$(jq -nc --arg cmd "$MIGRATE_CMD" \
            '{containerOverrides:[{name:"backend",command:["sh","-c",$cmd]}]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$ECS_TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "$NETWORK" \
            --overrides "$OVERRIDES" \
            --query 'tasks[0].taskArn' --output text)

          echo "migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)

          # awslogs 스트림 이름은 <prefix>/<container>/<task-id> 규칙으로 정해진다
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "backend/backend/${TASK_ARN##*/}" \
            --query 'events[].message' --output text || true

          if [ "$EXIT_CODE" != "0" ]; then
            echo "마이그레이션 실패 (exit $EXIT_CODE) — 배포를 중단한다"
            exit 1
          fi

      # 태스크 정의는 Terraform이 소유한다. 워크플로가 새 리비전을 등록하면 다음 apply가
      # 되돌리므로, 같은 태그를 덮어쓰고 서비스만 강제 재배포해 새 이미지를 끌어가게 한다.
      # 실패 시 deployment_circuit_breaker가 이전 태스크로 자동 롤백한다.
      - name: redeploy
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment > /dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
